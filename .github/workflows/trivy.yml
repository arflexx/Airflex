name: Trivy Security Scan

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
# Repository filesystem only: declared dependencies, secrets and IaC
# misconfigurations. Findings are reported to the Security tab, not enforced.
#
# The server container image (server/Dockerfile) is built, scanned and enforced
# by the image-scan job in server-ci.yml (issue #515). Do not scan it here too:
# both would upload to the `trivy-server` SARIF category.

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
# Runs on every pull request targeting main and on pushes to main. A weekly
# schedule catches newly disclosed CVEs in unchanged dependencies.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan — every Monday at 04:00 UTC (staggered from CodeQL)
    - cron: "0 4 * * 1"

# Cancel in-progress runs for the same branch/PR on new pushes.
concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
permissions:
  actions: read
  contents: read
  security-events: write  # required to upload SARIF results to the Security tab

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------------
  # Scan the repository filesystem for misconfigurations and secrets
  # -------------------------------------------------------------------------
  scan-filesystem:
    name: Trivy — Filesystem & IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Scan the repository for:
      #   - Hardcoded secrets / credentials
      #   - Infrastructure-as-code misconfigurations
      #   - Vulnerable library versions declared in manifests
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          # Reviewed exceptions, shared with the server image scan
          trivyignores: .trivyignore
          # Include secret detection and config checks in addition to vuln scanning
          scanners: vuln,secret,misconfig

      - name: Upload Trivy SARIF (filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem
