name: Deploy Soroban Contracts

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
# • Testnet: runs automatically after CI passes on main (push event).
# • Mainnet: MANUAL workflow_dispatch only — requires explicit human action.
#   Deploying to mainnet costs real XLM and produces immutable addresses.
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   SOROBAN_DEPLOYER_SECRET   Stellar secret key (S...) of the deployer account
#   SOROBAN_ADMIN_ADDRESS     Stellar public key (G...) to set as contract admin
#
# Optional variables (Settings → Variables → Actions; defaults apply if not set):
#   SOROBAN_RPC_URL            Override the RPC endpoint for the selected network
#   SOROBAN_ALLOWED_TOKENS     Comma-separated token contract IDs for the escrow
#   ESCROW_MAX_AMOUNT_STROOPS  Per-listing escrow cap
#
# Building, deploying, initializing, verifying and recording all happen in
# contracts/deploy.sh, so CI and local deploys follow the same path. Nothing is
# committed to deployments.json unless the post-deploy smoke test passes.
on:
  # Automatic testnet deploy after CI succeeds on main
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

  # Manual dispatch — used for BOTH testnet re-deploys and mainnet deploys.
  # Mainnet is gated behind the `mainnet` GitHub Environment which requires
  # a manual approval from a maintainer before the job runs.
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet
      contract:
        description: "Which contract to deploy"
        required: true
        default: all
        type: choice
        options:
          - all
          - escrow
          - marketplace
      initialize:
        description: "Call initialize() after deployment?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      rollback:
        description: "Re-deploy the previous WASM hash instead of building?"
        required: true
        default: false
        type: boolean

# One deploy at a time per network to prevent race conditions on deployments.json
concurrency:
  group: soroban-deploy-${{ github.event.inputs.network || 'testnet' }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # ── Guard: only proceed if CI passed (for the workflow_run trigger) ───────
  check-ci:
    name: Guard — CI must have passed
    runs-on: ubuntu-latest
    # For manual dispatch, always proceed. For workflow_run, only proceed on success.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI status OK
        run: echo "CI passed — proceeding with deploy."

  # ── Testnet deploy ─────────────────────────────────────────────────────────
  deploy-testnet:
    name: Deploy to Testnet
    needs: check-ci
    runs-on: ubuntu-latest
    # Run on: automatic testnet trigger, or manual dispatch targeting testnet
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'testnet')
    environment: testnet
    permissions:
      contents: write   # needed to commit deployments.json

    outputs:
      escrow_id:      ${{ steps.ids.outputs.escrow_id }}
      marketplace_id: ${{ steps.ids.outputs.marketplace_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Rust + WASM target ────────────────────────────────────────────────
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-deploy-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      # ── Deploy (or roll back) ─────────────────────────────────────────────
      # deploy.sh verifies each contract on-chain before recording it, and
      # exits non-zero without touching its entry when any step fails.
      - name: Deploy contracts
        env:
          SOROBAN_DEPLOYER_SECRET: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
          SOROBAN_ADMIN_ADDRESS: ${{ secrets.SOROBAN_ADMIN_ADDRESS }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          SOROBAN_ALLOWED_TOKENS: ${{ vars.SOROBAN_ALLOWED_TOKENS }}
          ESCROW_MAX_AMOUNT_STROOPS: ${{ vars.ESCROW_MAX_AMOUNT_STROOPS }}
          CONTRACT: ${{ github.event.inputs.contract || 'all' }}
          INITIALIZE: ${{ github.event.inputs.initialize || 'true' }}
          ROLLBACK: ${{ github.event.inputs.rollback || 'false' }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then
            MODE=--rollback
          else
            MODE=--force
          fi
          if [ "$INITIALIZE" = "true" ]; then INIT=yes; else INIT=no; fi
          bash contracts/deploy.sh \
            --network testnet \
            --contract "$CONTRACT" \
            --initialize "$INIT" \
            --commit no \
            "$MODE"

      # ── Post-deploy smoke test ────────────────────────────────────────────
      # Re-reads deployments.json and checks every deployed contract against
      # the network: WASM hash, admin, and paused state. Runs before the
      # registry is committed, so a broken deployment is never published.
      - name: Post-deploy smoke test
        env:
          SOROBAN_DEPLOYER_SECRET: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
          SOROBAN_ADMIN_ADDRESS: ${{ secrets.SOROBAN_ADMIN_ADDRESS }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          ESCROW_MAX_AMOUNT_STROOPS: ${{ vars.ESCROW_MAX_AMOUNT_STROOPS }}
          CONTRACT: ${{ github.event.inputs.contract || 'all' }}
          INITIALIZE: ${{ github.event.inputs.initialize || 'true' }}
        run: |
          if [ "$INITIALIZE" = "true" ]; then INIT=yes; else INIT=no; fi
          bash contracts/deploy.sh \
            --network testnet \
            --contract "$CONTRACT" \
            --initialize "$INIT" \
            --verify

      - name: Read deployed contract IDs
        id: ids
        env:
          CONTRACT: ${{ github.event.inputs.contract || 'all' }}
        run: |
          for name in escrow marketplace; do
            ID=""
            if [ "$CONTRACT" = "all" ] || [ "$CONTRACT" = "$name" ]; then
              ID=$(node contracts/scripts/deployments.cjs get \
                contracts/deployments.json testnet "$name" contract_id)
            fi
            echo "${name}_id=$ID" >> "$GITHUB_OUTPUT"
          done

      - name: Commit deployments.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contracts/deployments.json
          if git diff --cached --quiet; then
            echo "No changes to deployments.json — addresses unchanged."
          else
            git commit -m "chore(contracts): update testnet deployment addresses [skip ci]"
            git push
          fi

      # ── Structured test suite ─────────────────────────────────────────────
      - name: Run structured Rust tests
        working-directory: contracts
        run: make test

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print deployment summary
        run: |
          ESCROW_ID="${{ steps.ids.outputs.escrow_id }}"
          MARKET_ID="${{ steps.ids.outputs.marketplace_id }}"

          echo "### ✅ Testnet Contracts Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract | Contract ID | Explorer |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------------|----------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ESCROW_ID" ]; then
            echo "| Escrow | \`$ESCROW_ID\` | [Stellar Expert](https://stellar.expert/explorer/testnet/contract/$ESCROW_ID) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$MARKET_ID" ]; then
            echo "| Marketplace | \`$MARKET_ID\` | [Stellar Expert](https://stellar.expert/explorer/testnet/contract/$MARKET_ID) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | testnet |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit  | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next step:** Update \`ESCROW_CONTRACT_ID\` and \`MARKETPLACE_CONTRACT_ID\` in Railway." >> "$GITHUB_STEP_SUMMARY"

  # ── Mainnet deploy (MANUAL ONLY) ──────────────────────────────────────────
  deploy-mainnet:
    name: Deploy to Mainnet
    needs: check-ci
    runs-on: ubuntu-latest
    # ONLY runs on manual dispatch targeting mainnet.
    # The `mainnet` GitHub Environment MUST have a required reviewer configured
    # (Settings → Environments → mainnet → Required reviewers).
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.network == 'mainnet'
    environment: mainnet   # enforces manual approval gate
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-deploy-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      # ── Deploy (or roll back) ─────────────────────────────────────────────
      # deploy.sh verifies each contract on-chain before recording it, and
      # exits non-zero without touching its entry when any step fails.
      - name: Deploy contracts
        env:
          SOROBAN_DEPLOYER_SECRET: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
          SOROBAN_ADMIN_ADDRESS: ${{ secrets.SOROBAN_ADMIN_ADDRESS }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          SOROBAN_ALLOWED_TOKENS: ${{ vars.SOROBAN_ALLOWED_TOKENS }}
          ESCROW_MAX_AMOUNT_STROOPS: ${{ vars.ESCROW_MAX_AMOUNT_STROOPS }}
          CONTRACT: ${{ github.event.inputs.contract }}
          INITIALIZE: ${{ github.event.inputs.initialize }}
          ROLLBACK: ${{ github.event.inputs.rollback }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then
            MODE=--rollback
          else
            MODE=--force
          fi
          if [ "$INITIALIZE" = "true" ]; then INIT=yes; else INIT=no; fi
          bash contracts/deploy.sh \
            --network mainnet \
            --contract "$CONTRACT" \
            --initialize "$INIT" \
            --commit no \
            "$MODE" \
            --yes

      # ── Post-deploy smoke test ────────────────────────────────────────────
      # Re-reads deployments.json and checks every deployed contract against
      # the network: WASM hash, admin, and paused state. Runs before the
      # registry is committed, so a broken deployment is never published.
      - name: Post-deploy smoke test
        env:
          SOROBAN_DEPLOYER_SECRET: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
          SOROBAN_ADMIN_ADDRESS: ${{ secrets.SOROBAN_ADMIN_ADDRESS }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          ESCROW_MAX_AMOUNT_STROOPS: ${{ vars.ESCROW_MAX_AMOUNT_STROOPS }}
          CONTRACT: ${{ github.event.inputs.contract }}
          INITIALIZE: ${{ github.event.inputs.initialize }}
        run: |
          if [ "$INITIALIZE" = "true" ]; then INIT=yes; else INIT=no; fi
          bash contracts/deploy.sh \
            --network mainnet \
            --contract "$CONTRACT" \
            --initialize "$INIT" \
            --verify

      - name: Read deployed contract IDs
        id: ids
        env:
          CONTRACT: ${{ github.event.inputs.contract }}
        run: |
          for name in escrow marketplace; do
            ID=""
            if [ "$CONTRACT" = "all" ] || [ "$CONTRACT" = "$name" ]; then
              ID=$(node contracts/scripts/deployments.cjs get \
                contracts/deployments.json mainnet "$name" contract_id)
            fi
            echo "${name}_id=$ID" >> "$GITHUB_OUTPUT"
          done

      - name: Commit deployments.json (mainnet)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contracts/deployments.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(contracts): update mainnet deployment addresses [skip ci]"
            git push
          fi

      - name: Run structured Rust tests
        working-directory: contracts
        run: make test

      - name: Print mainnet deployment summary
        run: |
          ESCROW_ID="${{ steps.ids.outputs.escrow_id }}"
          MARKET_ID="${{ steps.ids.outputs.marketplace_id }}"

          echo "### ✅ Mainnet Contracts Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract | Contract ID | Explorer |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------------|----------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ESCROW_ID" ]; then
            echo "| Escrow | \`$ESCROW_ID\` | [Stellar Expert](https://stellar.expert/explorer/public/contract/$ESCROW_ID) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$MARKET_ID" ]; then
            echo "| Marketplace | \`$MARKET_ID\` | [Stellar Expert](https://stellar.expert/explorer/public/contract/$MARKET_ID) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | **mainnet** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
