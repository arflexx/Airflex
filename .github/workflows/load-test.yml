name: Load tests

# ---------------------------------------------------------------------------
# Supply-chain pinning
# ---------------------------------------------------------------------------
# Every `uses:` action is pinned to a full commit SHA (never a mutable tag or
# a branch name). The comment on each pinned action records the human-readable
# release the SHA corresponds to. Future upgrades MUST replace the SHA with a
# new commit SHA (never a tag or branch ref). See .github/dependabot.yml for
# the pinning strategy.
#
# IMPORTANT: this load test MUST run against a staging environment, never
# production. Provide a staging API base URL via the `base_url` input.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging API base URL (no trailing slash) — never production
        required: true
        type: string
      auth_token:
        description: Bearer JWT for the authenticated trade creation scenario
        required: false
        type: string
      vus:
        description: Concurrent virtual users (minimum 50, default 50)
        required: false
        type: number
        default: 50
      duration:
        description: Test duration (minimum 60s, default 2m)
        required: false
        type: string
        default: "2m"

permissions:
  contents: read
  pull-requests: write

jobs:
  k6:
    name: k6 stress tests
    runs-on: ubuntu-latest
    env:
      LOAD_TEST_BASE_URL: ${{ github.event.inputs.base_url }}
      LOAD_TEST_AUTH_TOKEN: ${{ github.event.inputs.auth_token }}
      # VU count and duration are configurable via workflow_dispatch inputs.
      LOAD_TEST_VUS: ${{ github.event.inputs.vus }}
      LOAD_TEST_DURATION: ${{ github.event.inputs.duration }}
      LOAD_TEST_OUTPUT_DIR: load-results

    steps:
      - name: Validate staging target (never production)
        run: |
          if [[ "${LOAD_TEST_BASE_URL}" =~ (production|production\.|-prod|api\.production) ]]; then
            echo "::error::Refusing to run load tests against a production base URL: ${LOAD_TEST_BASE_URL}" >&2
            exit 1
          fi
          echo "Load test target (staging): ${LOAD_TEST_BASE_URL}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test suite
        run: bash tests/load/run-all.sh

      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-load-results
          path: load-results/*.json

      - name: Compare against baseline and check regressions
        run: node tests/load/compare-baseline.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (when triggered from a PR branch)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const body = execSync('node tests/load/format-summary.mjs', { encoding: 'utf8' });
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });
            if (prs.data.length === 0) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs.data[0].number,
              body: `## k6 load test results\n\n${body}`,
            });
