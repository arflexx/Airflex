name: CI

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ---------------------------------------------------------------------------
# Supply-chain pinning
# ---------------------------------------------------------------------------
# Every `uses:` action is pinned to a full commit SHA (never a mutable tag or
# a branch name such as `@stable`/`@latest`). This prevents supply-chain
# attacks where a tag is moved to point at malicious code. The comment on each
# pinned action records the human-readable release the SHA corresponds to.
# Future upgrades MUST replace the SHA with a new commit SHA (never a tag or
# branch ref). See .github/dependabot.yml for the pinning strategy.
#

# Cancel in-progress runs for the same branch/PR when a new push arrives,
# saving minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------------
  # 1. Server — type-check + build
  # -------------------------------------------------------------------------
  server:
    name: Server (TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Type-check without emitting files — catches type errors fast
      - name: Type-check
        run: pnpm tsc --noEmit

      # Full compile to dist/ — confirms the build artefact is valid
      - name: Build
        run: pnpm build

      # Upload the compiled artefact so other jobs / releases can use it
      - name: Upload server build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-dist
          path: server/dist/
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2. Frontend — type-check + Next.js build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Type-check across the entire Next.js app
      - name: Type-check
        run: pnpm tsc --noEmit

      # Build the Next.js app — catches import errors, missing env vars
      # flagged as required, and invalid page exports.
      # NEXT_PUBLIC_API_URL is set to a placeholder so the build doesn't fail
      # on a missing env var; the real value is only needed at runtime.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Soroban contract — format check, clippy, tests
  # -------------------------------------------------------------------------
  contracts:
    name: Contracts (Rust / Soroban)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Rust toolchain pinned to match the Soroban SDK requirement.
      # The `wasm32v1-none` target is required for `stellar contract build`.
      # Pinned to a commit SHA (was `dtolnay/rust-toolchain@stable`, a mutable
      # branch ref) to satisfy the supply-chain pinning policy.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable channel
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown
          components: rustfmt, clippy

      # Cache the Cargo registry and build artifacts to speed up runs.
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: cargo-

      # Enforce consistent formatting (fails on any diff)
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Lint with all Soroban-relevant warnings treated as errors
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # Run the in-contract unit tests (uses soroban-sdk testutils)
      - name: Test
        run: cargo test

      # Build the release WASM to confirm it compiles to a deployable artefact.
      # This uses the workspace release profile (opt-level=z, LTO, etc.)
      - name: Build WASM
        run: cargo build --release --target wasm32v1-none

      - name: Upload WASM artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: escrow-wasm
          path: contracts/target/wasm32v1-none/release/airflex_escrow.wasm
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. Soroban contract arithmetic — 60s of fuzzing per target (issue #644)
  # -------------------------------------------------------------------------
  contracts-fuzz:
    name: Contracts (cargo-fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # libFuzzer's sanitizer instrumentation requires nightly.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable channel
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz escrow and marketplace arithmetic
        run: make fuzz

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: contracts/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # 5. Security audit — only on pushes to main (not every PR draft)
  # -------------------------------------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Audit server dependencies
        working-directory: server
        # `npm audit` exits non-zero on high/critical vulns
        run: npm audit --audit-level=high

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable channel

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: contracts
        run: cargo audit
