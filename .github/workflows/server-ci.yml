name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly image scan — every Monday at 04:30 UTC. Catches CVEs disclosed
    # after an unchanged image was last scanned. Only the image-scan job runs.
    - cron: "30 4 * * 1"

# Least privilege by default; jobs widen this only where they need to.
permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server quality gates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache server dependencies and TypeScript build cache
        uses: actions/cache@v4
        with:
          path: |
            server/node_modules
            server/tsconfig.tsbuildinfo
          key: server-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'server/tsconfig.json') }}
          restore-keys: |
            server-ci-${{ runner.os }}-

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.test .env

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Check generated OpenAPI document
        run: pnpm check:openapi

      - name: Check registered routes against OpenAPI
        run: pnpm check:route-spec

      - name: Test
        id: tests
        continue-on-error: true
        env:
          NODE_ENV: test
          DOTENV_CONFIG_PATH: .env.test
          NODE_OPTIONS: --require=dotenv/config
        # `--run` is a Vitest flag; Jest 29 aborts with "Unrecognized option
        # \"run\"" before running a single suite, so no test-results.json was
        # written and the JUnit conversion below failed on the missing file.
        run: pnpm exec jest --json --outputFile=test-results.json --runInBand --forceExit

      - name: Convert Jest results to JUnit XML
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('test-results.json')) {
            fs.writeFileSync('test-results.xml', '<testsuites tests="0" failures="0"></testsuites>');
            process.exit(0);
          }
          const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
          const escape = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
          const cases = (results.testResults || []).map((test) => {
            const duration = test.endTime && test.startTime ? test.endTime - test.startTime : 0;
            const failure = test.status === 'failed'
              ? `<failure message="${escape((test.message || '').split('\n')[0])}">${escape(test.message || '')}</failure>`
              : '';
            return `<testcase classname="${escape(test.testFilePath || 'server')}" name="${escape(test.testFilePath || 'test')}" time="${(duration / 1000).toFixed(3)}">${failure}</testcase>`;
          }).join('');
          const failures = results.numFailedTestSuites || 0;
          const tests = results.numTotalTestSuites || cases.length;
          fs.writeFileSync('test-results.xml', `<testsuites tests="${tests}" failures="${failures}">${cases}</testsuites>`);
          NODE

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-junit-results
          path: server/test-results.xml
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # -------------------------------------------------------------------------
  # Container image scan (issue #515)
  # -------------------------------------------------------------------------
  # Builds server/Dockerfile — and no other image — then fails on any CRITICAL
  # or HIGH vulnerability that has a fix. Repository filesystem scanning lives
  # in trivy.yml. Runs in parallel with the quality gates so a failing test
  # never hides a vulnerable image.
  image-scan:
    name: Server image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read           # upload-sarif reads run metadata in private repos
      security-events: write  # upload SARIF to the Security tab

    env:
      IMAGE: airflex-server:${{ github.sha }}
      SARIF_FILE: trivy-server-results.sarif

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Loaded into the local Docker daemon for scanning; never pushed. The base
      # image is re-resolved on every run, so cached layers are only reused
      # while node:20-alpine is unchanged.
      - name: Build server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          tags: ${{ env.IMAGE }}
          pull: true
          push: false
          load: true
          provenance: false
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max,ignore-error=true

      # The Trivy DB is cached by the action (`cache` defaults to true).
      # Without limit-severities-for-sarif the action drops `severity` for SARIF
      # output, and the gate would also fail on LOW and MEDIUM findings.
      - name: Scan server image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: ${{ env.SARIF_FILE }}
          exit-code: "1"
          timeout: 5m

      # SARIF is unreadable in a job log, so print the blocking findings too.
      - name: Show blocking vulnerabilities
        if: failure() && steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "0"
          # Trivy and its DB are already present from the previous step.
          skip-setup-trivy: true
          cache: false

      # Both uploads run when the scan fails — that is when findings matter —
      # but not when the build failed before a report existed. Pull requests
      # from forks may lack permission to write security events; the scan step
      # above is the gate, so that must not fail the job.
      - name: Upload Trivy SARIF to the Security tab
        if: always() && hashFiles('trivy-server-results.sarif') != ''
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: ${{ env.SARIF_FILE }}
          category: trivy-server

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-server-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-server-results
          path: ${{ env.SARIF_FILE }}
          retention-days: 14
